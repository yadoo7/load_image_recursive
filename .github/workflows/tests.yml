name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 测试自带 ComfyUI 的最小 stub，所以不用装 torch。
      - name: Install test dependencies
        run: python -m pip install --upgrade pip aiohttp pillow

      - name: Byte-compile everything
        run: python -m compileall -q __init__.py tools tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82,F401,F841 .
