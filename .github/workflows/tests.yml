name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Python 3.9 已于 2025-10 停止维护，在 ubuntu-latest（24.04）上
    # actions/setup-python 匹配不到 3.9 的预编译包，连续两次重跑都挂在
    # 这一步（代码一次都没执行）。因此把 3.9 钉在 ubuntu-22.04，
    # 3.12 继续跑 latest。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      # 装 Python 失败时，这几行能直接看出跑在哪个镜像上。
      - name: Show runner image
        run: |
          uname -m
          (lsb_release -ds || head -2 /etc/os-release)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 测试自带 ComfyUI 的最小 stub，所以不用装 torch。
      - name: Install test dependencies
        run: python -m pip install --upgrade pip aiohttp pillow

      - name: Byte-compile everything
        run: python -m compileall -q __init__.py tools tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82,F401,F841 .
