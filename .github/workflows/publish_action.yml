name: Publish to Comfy registry

# Triggers:
#   - manually from the Actions tab (workflow_dispatch)
#   - automatically whenever pyproject.toml changes on main (i.e. a version bump)
#
# Requires a repository secret named REGISTRY_ACCESS_TOKEN, holding a
# Comfy Registry API key (format: cnr_xxxxxxxx). Create one at
# https://registry.comfy.org/nodes -> your publisher -> API Keys,
# then add it under Settings > Secrets and variables > Actions.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Fail early with a readable message instead of a cryptic auth error.
      - name: Verify registry token is configured
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error title=Missing secret::REGISTRY_ACCESS_TOKEN is not set. Add it in Settings > Secrets and variables > Actions (value format: cnr_xxxxxxxx)."
            exit 1
          fi
          echo "Registry token is present (length ${#REGISTRY_TOKEN})."

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
